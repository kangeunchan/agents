apiVersion: openclawctl/v1
metadata:
  name: openclaw-codex-oauth-dev
  description: YAML-first OpenClaw manifest aligned to official docs (Codex OAuth + gpt-5.3-codex)
  labels:
    source.docs: docs.openclaw.ai
    auth: oauth
    model: openai-codex/gpt-5.3-codex

# Runtime gateway (container bind is LAN; host publish is loopback-only via compose/docker port mapping)
gateway:
  mode: local
  bind: 0.0.0.0
  port: 18789
  tokenEnv: ${OPENCLAW_GATEWAY_TOKEN}
  health:
    path: /health
    intervalSeconds: 30
    timeoutSeconds: 5
    failureThreshold: 3

# Model provider for OpenAI Codex OAuth
providers:
  codex_oauth:
    type: openai-codex
    model: gpt-5.3-codex
    options:
      authMode: oauth
      profileId: openai-codex:default
    retry:
      attempts: 3
      initialMillis: 500
      maxMillis: 5000
    timeout:
      connectSeconds: 10
      readSeconds: 120
      totalSeconds: 180

channels:
  default:
    provider: codex_oauth
    model: gpt-5.3-codex
    enabled: true
    priority: 100
    maxTokens: 32768
    temperature: 0.2
    streaming: true
    systemPrompt: You are a pragmatic coding assistant.
    headers:
      x-team: ${OPENCLAW_TEAM:-local}

routing:
  defaultChannel: default

agents:
  defaults:
    # off|minimal|low|medium|high|xhigh (extra-high alias supported)
    thinkingDefault: extra-high

commands:
  # Disable native slash commands globally.
  native: false
  nativeSkills: auto
  # Current OpenClaw build checks access groups at root commands scope.
  useAccessGroups: false
  # Optional: restrict command operators explicitly by Discord user ID.
  # allowFrom:
  #   discord:
  #     - "${OPENCLAW_DISCORD_OPERATOR_ID}"

# OpenClaw runtime chat channel config (rendered to openclaw.json -> channels.*)
chatChannels:
  discord:
    enabled: true
    # Token is resolved by OpenClaw runtime from DISCORD_BOT_TOKEN env.
    # (official docs support env fallback for default Discord account)
    commands:
      # Disable Discord slash-command registration for chat-only workflow.
      native: false
    dm:
      enabled: true
      policy: pairing
    # Dedicated-channel mode: allow only explicitly listed guild/channel.
    groupPolicy: ${OPENCLAW_DISCORD_GROUP_POLICY:-allowlist}
    guilds:
      "${OPENCLAW_DISCORD_GUILD_ID:-100000000000000000}":
        requireMention: false
        channels:
          "${OPENCLAW_DISCORD_CHANNEL_ID:-100000000000000000}":
            allow: true
            requireMention: false

plugins:
  enabled: true
  entries:
    # Bundled example: loaded plugin control via YAML
    copilot-proxy:
      enabled: true
      # config:
      #   # plugin-specific settings (if needed)
      #   # exampleKey: exampleValue

auth:
  tokenEnv: ${OPENCLAW_GATEWAY_TOKEN}
  allowedCIDRs:
  - 127.0.0.1/32
  - ::1/128

logging:
  level: info
  format: json
  structured: true
  fields:
    service: openclaw
    env: ${OPENCLAW_ENV:-dev}

runtime:
  containerName: openclaw-gateway
  image: openclaw-gateway:local
  composeFile: openclaw/docker-compose.dev.yaml
  configPath: ${HOME}/.openclawctl/openclaw.json
  stateDir: /var/lib/openclaw
  stateVolume: openclaw_state
  # Exec command approval policy
  # full        = no prompt (fully allowed)
  # partial     = allowlist + prompt on miss
  # per-command = allowlist + always prompt
  execApprovalPreset: per-command
